<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <link rel="stylesheet" href="./app/css/bootstrap.min.css">
    <link rel="stylesheet" href="./app/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./app/css/main.css">
    <link rel="icon" href="./app/img/camera-white.png">
    <title>Comentarios Virtuais</title>

</head>

<body>

    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="card">
            <div class="card-body">
                <p class="text-center"><i class="bi bi-person-plus" style="font-size: 4rem;"></i></p>
                <p class="text-center" style="font-size: 2rem; color: rgb(79, 77, 88);">Informações Pessoais</p>

                <div class="row">
                    <div class="col-sm-12">
                        <div class="form-group">

                            <p class="text-center">Para tornar seu vídeo ainda mais especial, contamos com a sua ajuda!
                                Ao nos fornecer algumas informações.</p>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm-12">
                        <div class="form-group">
                            <!-- <label for="name">Name</label> --> <input class="form-control" type="text" id="ipt-name" placeholder="Nome Completo">
                        </div>
                    </div>
                </div>

                <div class="row">

                    <div class="col-sm-12">
                        <div class="form-group">
                            <div class="input-group"> <input class="form-control" type="phone" id="ipt-phone" placeholder="Telefone">
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary btn-block confirm-button" onclick="env_cad_grava()">Enviar</button>
            </div>
        </div>
    </div>

    <div class="fixed-bottom">
        <small class="footer-text">for little seal&nbsp;<i class="bi bi-heart-fill">&nbsp;</i></small>
    </div>

    <script src="./app/js/jquery-3.7.1.min.js"></script>
    <script src="./app/js/bootstrap.bundle.min.js"></script>
    <script src="./app/js/main.js"></script>

</body>

</html>
