<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <link rel="stylesheet" href="./app/css/bootstrap.min.css">
    <link rel="stylesheet" href="./app/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./app/css/main.css">
    <link rel="icon" href="./app/img/camera-white.png">
    <title>Comentarios Virtuais</title>
</head>

<body>

    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="form-group">
                            <div class="cardCamera">
                                    <!-- VIDEO CAMERA -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col" style="text-align:center; margin-top: 1.5rem;">
                        <button type="button" class="btn btn-outline-secondary btn-none-fill">
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                                class="bi bi-three-dots" viewBox="0 0 16 16">
                                <path
                                    d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3">
                                </path>
                            </svg>
                        </button>
                    </div>
                    <div class="col" style="text-align:center; margin-top: 1rem;">

                        <button type="button" class="btn btn-danger btn-circle btn-lg"><svg
                                xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                                class="bi bi-record-fill" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 13A5 5 0 1 0 8 3a5 5 0 0 0 0 10"></path>
                            </svg></button>
                        </button>
                    </div>
                    <div class="col" style="text-align:center; margin-top: 1.5rem;">
                        <small style="font-size: 1.2rem; color: rgb(73, 73, 73);">00:00</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed-bottom">
        <small class="footer-text">for little seal&nbsp;<i class="bi bi-heart-fill">&nbsp;</i></small>
    </div>

    <script src="./app/js/jquery-3.7.1.min.js"></script>
    <script src="./app/js/bootstrap.bundle.min.js"></script>
    <script src="./app/js/main.js"></script>


</body>

</html>
